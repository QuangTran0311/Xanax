<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quy trình — Xanax</title>
<link rel="icon" href="/static/images/xanax.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
svg.icon{width:20px;height:20px;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-4px}
:root{
  /* Token gốc "Quản lý một đội ngũ" — bản Tối ấm (tự soạn) */
  --bg-card:#2C2721; --ink:#F0EAE0; --ink-muted:#A99E8E; --ink-soft:#C7BCAC;
  --accent:#5B8F7F; --accent-soft:rgba(95,143,127,0.18);
  --gold:#E0B265; --gold-soft:rgba(224,178,101,0.16);
  --lavender-ink:#B29FE8; --peach-ink:#E0935A; --mint-ink:#5FC996; --sky-ink:#6FA8D6;
  --status-on:#6FBF8F; --status-idle:#7A7266;
  --radius-token:14px; --radius-sm-token:10px;
  --shadow:0 6px 24px rgba(0,0,0,0.35); --shadow-hover:0 10px 30px rgba(0,0,0,0.45);

  --bg:#221E1A;--surface:var(--bg-card);--surface2:#332D26;--surface3:#3C352D;
  --border:#3A342C;--border2:#4A4238;
  --cyan:var(--accent);--purple:var(--lavender-ink);
  --green:var(--status-on);--red:#D9695C;--amber:var(--gold);--blue:var(--sky-ink);
  --cyan-rgb:91,143,127;--purple-rgb:178,159,232;--green-rgb:111,191,143;
  --red-rgb:217,105,92;--amber-rgb:224,178,101;--blue-rgb:111,168,214;
  --text:var(--ink);--text2:var(--ink-muted);--text3:var(--ink-muted);
  --radius:var(--radius-sm-token);--radius-lg:var(--radius-token);
  --mono:'JetBrains Mono',monospace;
}
/* ── Token gốc — bản Sáng (mặc định, đúng brief) ── */
body.light{
  --bg-card:#FFFFFF; --ink:#2B2620; --ink-muted:#948A7C; --ink-soft:#5C5548;
  --accent:#4F7C6F; --accent-soft:#E4EEEA;
  --gold:#D9A552; --gold-soft:#FBF0DE;
  --lavender-ink:#7C6BAE; --peach-ink:#C97A3A; --mint-ink:#3F8A63; --sky-ink:#4A7FA6;
  --status-on:#5FA57A; --status-idle:#C7BFAF;
  --shadow:0 6px 24px rgba(43,38,32,0.07); --shadow-hover:0 10px 30px rgba(43,38,32,0.11);

  --bg:#FBF7F1;--surface:var(--bg-card);--surface2:#F5F0E8;--surface3:#EFE8DC;
  --border:#EDE6D9;--border2:#DDD3C2;
  --cyan:var(--accent);--purple:var(--lavender-ink);--green:var(--status-on);--red:#C1443A;--amber:var(--gold);--blue:var(--sky-ink);
  --cyan-rgb:79,124,111;--purple-rgb:124,107,174;--green-rgb:95,165,122;
  --red-rgb:193,68,58;--amber-rgb:217,165,82;--blue-rgb:74,127,166;
  --text:var(--ink);--text2:var(--ink-muted);--text3:var(--ink-muted);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* ── Topbar (standalone only, ẩn khi nhúng qua iframe) ── */
#topbar{
  height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:8px;flex-shrink:0;
}
.logo{font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-0.2px;display:inline-flex;align-items:center;gap:8px}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}
.page-title{font-size:12.5px;color:var(--text2);font-weight:500;padding-left:12px;border-left:1px solid var(--border)}

/* ── Page wrap ── */
#page-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}

/* ── Status filter tabs ── */
.filter-tabs{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  margin:18px 24px 0;flex-wrap:wrap;
}
.filter-tabs-list{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-tab{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:9px;border:1px solid transparent;
  background:none;color:var(--text2);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .15s;font-family:inherit;
}
.filter-tab svg{width:13px;height:13px;flex-shrink:0}
.filter-tab:hover{background:var(--surface2);color:var(--text)}
.filter-tab.active{background:rgba(var(--cyan-rgb),.1);color:var(--cyan);border-color:rgba(var(--cyan-rgb),.3)}
.filter-tab .count{font-family:var(--mono);font-size:11px;color:var(--text3)}
.filter-tab.active .count{color:var(--cyan)}

.filter-search{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border2);border-radius:9px;
  padding:0 12px;height:34px;width:200px;transition:border-color .15s;
}
.filter-search:focus-within{border-color:var(--cyan)}
.filter-search svg{width:13px;height:13px;color:var(--text3);flex-shrink:0}
.filter-search input{
  flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:12.5px;
}
.filter-search input::placeholder{color:var(--text3)}

/* ── Grid ── */
#grid-wrap{flex:1;overflow-y:auto;padding:16px 24px 100px}
.workflow-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
}

.workflow-card{
  border-radius:var(--radius-lg);
  background:var(--bg-card);padding:18px;display:flex;flex-direction:column;gap:12px;
  transition:box-shadow .2s ease, transform .2s ease;
  box-shadow:var(--shadow);
}
.workflow-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}

.wf-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.wf-name{font-size:14.5px;font-weight:600;color:var(--text)}
.wf-desc{font-size:12px;color:var(--text2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}

.wf-status{
  font-size:10px;font-family:var(--mono);font-weight:600;padding:3px 9px;border-radius:20px;
  display:flex;align-items:center;gap:5px;flex-shrink:0;white-space:nowrap;
}
.wf-status .dot{width:6px;height:6px;border-radius:50%}
.wf-status.active{color:var(--green);background:rgba(var(--green-rgb),.1)}
.wf-status.active .dot{background:var(--green);box-shadow:0 0 0 2px rgba(var(--green-rgb),.2)}
.wf-status.paused{color:var(--amber);background:rgba(var(--amber-rgb),.1)}
.wf-status.paused .dot{background:var(--amber)}
.wf-status.draft{color:var(--text3);background:var(--surface3)}
.wf-status.draft .dot{background:var(--text3)}
.wf-status.failed{color:var(--red);background:rgba(var(--red-rgb),.1)}
.wf-status.failed .dot{background:var(--red)}

/* Flow diagram */
.wf-flow{display:flex;align-items:center;height:20px}
.wf-flow-node{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wf-flow-line{flex:1;height:1.5px;min-width:8px;opacity:.45}

/* Stats row */
.wf-stats{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wf-stat{display:flex;flex-direction:column;gap:4px}
.wf-stat-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono)}
.wf-stat-value{font-size:15px;font-weight:700;font-family:var(--mono)}
.wf-stat-value.good{color:var(--green)}
.wf-stat-value.warn{color:var(--amber)}
.wf-stat-value.bad{color:var(--red)}
.wf-stat-value.neutral{color:var(--text)}
.wf-stat-value.muted{color:var(--text2);font-size:12px;font-weight:500}

.wf-schedule{
  display:inline-flex;align-items:center;gap:6px;width:fit-content;
  background:var(--surface3);border:1px solid var(--border);border-radius:6px;
  padding:3px 8px;font-size:10.5px;font-family:var(--mono);color:var(--text2);
}
.wf-schedule svg{width:11px;height:11px;color:var(--text3)}

.wf-footer{
  container-type:inline-size;container-name:wf-footer;
  display:flex;align-items:center;gap:clamp(2px,1.2cqw,6px);padding-top:10px;border-top:1px solid var(--border);flex-wrap:nowrap;
}
.wf-btn{
  display:flex;align-items:center;justify-content:center;gap:clamp(2px,1cqw,6px);border-radius:7px;
  font-size:clamp(9.5px,2.6cqw,12px);font-weight:500;
  cursor:pointer;font-family:inherit;padding:7px clamp(4px,1.8cqw,11px);border:1px solid var(--border2);
  background:none;color:var(--text2);transition:all .15s;white-space:nowrap;
  flex:1 1 0;min-width:0;overflow:hidden;text-overflow:clip;
}
.wf-btn svg{width:clamp(10px,2.6cqw,12px);height:clamp(10px,2.6cqw,12px);flex-shrink:0}
.wf-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface3)}
.wf-btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04141a;font-weight:700}
.wf-btn.primary:hover{box-shadow:0 4px 14px rgba(var(--cyan-rgb),.3)}
.wf-btn.icon-only{padding:7px 9px;flex:0 0 auto}
.wf-btn.icon-only.danger:hover{border-color:var(--red);color:var(--red);background:rgba(var(--red-rgb),.08)}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:60px 0;color:var(--text3)}
.empty-state-icon{font-size:32px}
.empty-state-text{font-size:13px}

/* ── Add button ── */
#add-workflow-btn{
  position:absolute;right:24px;bottom:24px;
  display:flex;align-items:center;gap:8px;
  background:var(--cyan);color:#04141a;font-weight:700;font-size:13px;
  border:none;border-radius:999px;padding:12px 20px;cursor:pointer;
  box-shadow:0 6px 20px rgba(var(--cyan-rgb),.3);transition:all .15s;
  font-family:inherit;
}
#add-workflow-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--cyan-rgb),.4)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ══════════════════════════════════════════
   EDITOR VIEW
   ══════════════════════════════════════════ */
#view-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ── Editor topbar ── */
#editor-topbar{
  height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);
}
.editor-icon-btn{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:none;border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:all .15s;
}
.editor-icon-btn svg{width:16px;height:16px}
.editor-icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.editor-icon-btn.small{width:24px;height:24px;border:none}
.editor-icon-btn.small svg{width:13px;height:13px}
.editor-logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg, var(--cyan), var(--purple));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.editor-logo svg{width:18px;height:18px}
.editor-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.editor-title{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.editor-title[contenteditable="true"]{outline:1px dashed var(--cyan);border-radius:4px;padding:1px 4px}
.editor-topbar-spacer{flex:1}
.editor-btn{
  display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
  background:none;border:1px solid var(--border2);color:var(--text2);
  font-size:12.5px;font-weight:500;border-radius:8px;padding:8px 14px;
  cursor:pointer;font-family:inherit;transition:all .15s;margin-left:4px;
}
.editor-btn svg{width:14px;height:14px}
.editor-btn:hover{border-color:var(--cyan);color:var(--text)}
.editor-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.editor-btn.primary:hover{box-shadow:0 4px 14px rgba(var(--blue-rgb),.4)}

/* ── Editor body layout ── */
#editor-body{flex:1;display:flex;overflow:hidden;min-height:0}

/* ── Node palette ── */
#node-palette{
  width:270px;flex-shrink:0;border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface);
}
.palette-header{
  font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.6px;font-family:var(--mono);padding:14px 16px 8px;
}
.palette-search{position:relative;padding:0 16px 12px}
.palette-search input{
  width:100%;padding:8px 30px 8px 10px;border-radius:7px;
  background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  font-family:inherit;font-size:12.5px;outline:none;
}
.palette-search input:focus{border-color:var(--cyan)}
.palette-search svg{position:absolute;right:26px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3);pointer-events:none}
#palette-categories{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px}
.palette-cat{margin-bottom:2px}
.palette-cat-header{
  display:flex;align-items:center;gap:8px;padding:9px 8px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--text);border-radius:6px;user-select:none;
}
.palette-cat-header:hover{background:var(--surface2)}
.palette-cat-header .chev{width:12px;height:12px;color:var(--text3);transition:transform .15s;margin-left:auto;flex-shrink:0}
.palette-cat.collapsed .chev{transform:rotate(-90deg)}
.palette-cat.collapsed .palette-cat-items{display:none}
.palette-cat-items{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px}
.palette-node-item{
  display:flex;align-items:center;gap:9px;padding:7px 8px 7px 20px;border-radius:6px;
  cursor:grab;transition:background .15s;
}
.palette-node-item:hover{background:var(--surface2)}
.palette-node-item .node-icon{
  width:24px;height:24px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.palette-node-item .node-icon svg{width:13px;height:13px}
.palette-node-item .node-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.palette-node-item .node-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette-node-item .node-desc{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Canvas ── */
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0/22px 22px, var(--bg);
}
.architect-btn{
  position:absolute;top:16px;right:20px;z-index:5;
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--cyan);color:var(--cyan);
  font-size:12.5px;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.architect-btn svg{width:14px;height:14px}
.architect-btn:hover{background:rgba(var(--cyan-rgb),.1)}
#editor-canvas{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab}
#editor-canvas.panning{cursor:grabbing}
#canvas-viewport{position:absolute;top:0;left:0;transform-origin:0 0;width:1500px;height:900px;will-change:transform}
#canvas-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* pointer-events:none để click ở vùng trống (không phải node) xuyên qua tới
   #canvas-lines bên dưới — nếu không thì div này (nằm đè lên svg) sẽ chặn hết
   click vào đường nối, khiến không bấm xoá kết nối được. .flow-node bật lại
   auto để bản thân node vẫn kéo/chọn/kết nối bình thường. */
#canvas-nodes{position:absolute;inset:0;pointer-events:none}

.flow-node{
  position:absolute;border-radius:12px;border:1.5px solid var(--border2);
  background:var(--surface2);padding:12px 16px;display:flex;align-items:center;gap:11px;
  cursor:grab;transition:border-color .15s,box-shadow .15s;min-width:170px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);user-select:none;pointer-events:auto;
}
.flow-node:hover{border-color:var(--cyan)}
.flow-node.selected{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(var(--cyan-rgb),.15)}
.flow-node.dragging{cursor:grabbing;z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.flow-node.node-running{border-color:transparent;box-shadow:var(--shadow)}
.flow-node.node-running::before{
  content:'';position:absolute;inset:-3px;border-radius:inherit;padding:3px;
  background:conic-gradient(from var(--node-spin-angle,0deg), transparent 0%, var(--cyan) 20%, transparent 45%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:node-running-spin 1.1s linear infinite;pointer-events:none;
}
/* Animate góc của conic-gradient (chỉ màu chạy quanh viền) thay vì transform:rotate
   (xoay cả khối chữ nhật) — cần khai báo kiểu <angle> để trình duyệt nội suy được. */
@property --node-spin-angle{
  syntax:'<angle>';inherits:false;initial-value:0deg;
}
@keyframes node-running-spin{ from{--node-spin-angle:0deg} to{--node-spin-angle:360deg} }
.flow-node.node-done{border-color:var(--green)}
.flow-node.node-done::after{content:'✓';position:absolute;right:7px;top:5px;color:var(--green);font-size:12px;font-weight:800}
.flow-node.node-error{border-color:var(--red);box-shadow:0 0 0 3px rgba(var(--red-rgb),.12)}
.flow-node.node-paused{border-color:var(--amber);box-shadow:0 0 0 3px rgba(var(--amber-rgb),.14)}

/* Cùng trạng thái chạy đó, hiển thị trên thẻ bước của chế độ Đơn giản */
.se-card{border:2px solid transparent}
.se-card.node-running{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(var(--cyan-rgb),.14)}
.se-card.node-done{border-color:var(--green)}
.se-card.node-error{border-color:var(--red);box-shadow:0 0 0 3px rgba(var(--red-rgb),.12)}
.se-card.node-paused{border-color:var(--amber);box-shadow:0 0 0 3px rgba(var(--amber-rgb),.14)}
.se-card.node-running .se-card-title::after{content:' · đang chạy';color:var(--cyan);font-weight:600;font-size:11px}
.se-card.node-paused .se-card-title::after{content:' · chờ duyệt';color:var(--amber);font-weight:600;font-size:11px}
.se-card.node-error .se-card-title::after{content:' · lỗi';color:var(--red);font-weight:600;font-size:11px}
.flow-node .node-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.flow-node .node-icon svg{width:19px;height:19px}
.flow-node .node-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.flow-node .node-title{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap}
.flow-node .node-sub{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.flow-node .node-port{
  position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--bg);
  cursor:crosshair;transition:transform .12s,box-shadow .12s;z-index:2;
}
.flow-node .node-port::before{
  /* Vùng bắt chuột lớn hơn hình tròn hiển thị, để dễ bấm/kéo trúng port hơn */
  content:'';position:absolute;inset:-9px;border-radius:50%;
}
.flow-node .node-port:hover{transform:translateY(-50%) scale(1.5);box-shadow:0 0 0 5px rgba(var(--cyan-rgb),.18)}
.flow-node .node-port.out{right:-6px;top:50%;transform:translateY(-50%)}
.flow-node .node-port.out.yes{background:var(--green)}
.flow-node .node-port.out.no{background:var(--red)}
.flow-node .node-port.in{left:-6px;top:50%;transform:translateY(-50%);background:var(--cyan)}
.flow-node.connect-target{border-color:var(--green) !important;box-shadow:0 0 0 4px rgba(34,197,94,.22) !important}
#canvas-nodes.connecting .flow-node:not(.connect-source){cursor:crosshair}
.temp-connect-line{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.flow-node .branch-label{
  position:absolute;font-size:10px;font-weight:700;font-family:var(--mono);
  background:var(--bg);padding:1px 6px;border-radius:4px;
}

/* ── Kết nối giữa các node — bấm để xoá ── */
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.edge-line{fill:none;stroke-width:2;pointer-events:none;transition:stroke .15s,stroke-width .15s}
.edge-hit:hover + .edge-line{stroke:var(--red) !important;stroke-width:3}

/* ── Popup xác nhận ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--bg-card);border-radius:var(--radius-lg);padding:22px;width:340px;box-shadow:var(--shadow-hover)}
.modal-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.modal-desc{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-btn{background:none;border:1px solid var(--border2);color:var(--text2);font-size:12.5px;font-weight:500;border-radius:8px;padding:8px 16px;cursor:pointer;font-family:inherit;transition:all .15s}
.modal-btn:hover{border-color:var(--cyan);color:var(--text)}
.modal-btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.modal-btn.danger:hover{box-shadow:0 4px 14px rgba(var(--red-rgb),.4)}
.modal-btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff;font-weight:700}
.modal-input{
  width:100%;box-sizing:border-box;resize:vertical;min-height:96px;
  background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font:inherit;font-size:12.5px;line-height:1.5;padding:10px;outline:none;
}
.modal-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(var(--cyan-rgb),.12)}
#toast-container{
  position:fixed;right:20px;top:20px;z-index:2000;display:flex;flex-direction:column;
  gap:9px;width:min(360px,calc(100vw - 40px));pointer-events:none;
}
.toast{
  background:var(--bg-card);border:1px solid var(--border2);border-left:4px solid var(--cyan);
  border-radius:10px;box-shadow:var(--shadow-hover);color:var(--text);font-size:12.5px;
  line-height:1.5;padding:11px 13px;opacity:0;transform:translateY(-8px);
  transition:opacity .18s,transform .18s;pointer-events:auto;
}
.toast.visible{opacity:1;transform:translateY(0)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--cyan)}
.se-card{
  width:100%;max-width:640px;background:var(--surface2);border-radius:var(--radius-lg);
  padding:18px 20px;display:flex;flex-direction:column;gap:12px;position:relative;
  box-shadow:var(--shadow);flex-shrink:0;
}
.se-card-header{display:flex;align-items:center;gap:12px}
.se-card-icon{
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:#fff;flex-shrink:0;
}
.se-card-icon svg{width:18px;height:18px}
.se-card-title-wrap{flex:1;min-width:0}
.se-card-title{
  font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.se-card-subtitle{
  font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.se-card-delete{
  background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;
  border-radius:4px;transition:all .12s;
}
.se-card-delete:hover{color:var(--red);background:rgba(var(--red-rgb),.1)}
.se-card-body{
  display:flex;flex-direction:column;gap:10px;padding-top:12px;
  border-top:1px solid var(--border);
}
/* Bộ field dùng chung với inspector, khi nằm trong thẻ bước của chế độ Đơn giản */
.se-card-body .real-node-field{margin-bottom:12px}
.se-card-body .real-node-field:last-child{margin-bottom:0}
.se-card-body .real-node-field input:not([type=checkbox]),
.se-card-body .real-node-field select,
.se-card-body .real-node-field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;
}
.se-card-body .real-node-field textarea{resize:vertical;line-height:1.5;min-height:70px}
.se-card-body .real-node-field input:focus,
.se-card-body .real-node-field select:focus,
.se-card-body .real-node-field textarea:focus{border-color:var(--cyan)}
.se-field-label{
  display:block;color:var(--text2);font-size:11px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;
}
.se-input,.se-textarea{
  width:100%;box-sizing:border-box;padding:8px 12px;border-radius:6px;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;
}
.se-input:focus,.se-textarea:focus{border-color:var(--cyan)}
.se-input::placeholder,.se-textarea::placeholder{color:var(--text3)}
textarea.se-input,.se-textarea{resize:vertical;line-height:1.5}
.se-textarea{min-height:70px}
.se-arrow-wrap{
  display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0;flex-shrink:0;
}

/* Node Điều kiện: hai nhánh nằm gọn trong thẻ của nó — ô trên cho luồng Đúng,
   ô dưới cho luồng Sai — nên danh sách bên ngoài vẫn tuyến tính. */
.se-branch-wrap{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.se-branch{border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.se-branch.is-true{border-left:3px solid var(--green)}
.se-branch.is-false{border-left:3px solid var(--red)}
.se-branch-head{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 12px;background:var(--surface2);color:var(--text2);
}
.se-branch.is-true .se-branch-head{color:var(--green)}
.se-branch.is-false .se-branch-head{color:var(--red)}
.se-branch-body{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;
}
/* Thẻ bước lồng trong nhánh: nhỏ và nhạt hơn để phân cấp rõ */
.se-branch-body .se-card{max-width:100%;background:var(--surface2);box-shadow:none;border:1px solid var(--border)}
.se-branch-body .se-arrow-wrap{margin:0}
.se-card.is-orphan{opacity:.75;border:1px dashed var(--border2)}

/* Bảng chọn loại bước khi chèn ở chế độ Đơn giản */
.pick-node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pick-node-item{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.pick-node-item:hover{border-color:var(--cyan);background:var(--surface3)}
.pick-node-item .node-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.pick-node-item .node-icon svg{width:15px;height:15px}
.pick-node-item .node-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick-node-item .node-name{font-size:12.5px;font-weight:600;color:var(--text)}
.pick-node-item .node-desc{font-size:11px;color:var(--text3);line-height:1.4}
.se-arrow-icon{font-size:14px;color:var(--border2);line-height:1}
.se-add-btn{
  background:var(--bg2);border:1px dashed var(--border2);color:var(--text2);
  padding:6px 14px;border-radius:8px;font-size:11.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;
}
.se-add-btn:hover{
  border-color:var(--cyan);color:var(--cyan);
  background:rgba(var(--cyan-rgb),.04);
}
.form-group{margin-bottom:16px}
.real-node-fields{padding:14px 0 2px}
.real-node-field{margin-bottom:12px}
.real-node-fields.inspector-section-body{padding-left:0;padding-right:0}
.inspector-section-body textarea{
  width:100%;box-sizing:border-box;resize:vertical;background:var(--surface2);
  border:1px solid var(--border2);border-radius:6px;color:var(--text);
  font-family:inherit;font-size:12px;line-height:1.5;padding:7px 9px;outline:none;
}
.inspector-section-body textarea:focus{border-color:var(--cyan)}
.se-check-list{display:grid;gap:4px}
.se-check-row{
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;user-select:none;
  font-size:12px;line-height:1.5;color:var(--text);
}
.se-check-row input[type="checkbox"]{
  flex:0 0 auto;margin:2px 0 0;cursor:pointer;
}
.se-skill-type{color:var(--text3);font-size:10.5px}
.se-empty-hint{display:block;color:var(--text3);font-size:11px;line-height:1.5;padding:5px 2px}

/* ── Zoom controls ── */
#zoom-controls{
  position:absolute;left:20px;bottom:20px;z-index:5;
  display:flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--border2);border-radius:10px;padding:6px;
}
.zoom-btn{
  width:28px;height:28px;border-radius:7px;background:none;border:none;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;
}
.zoom-btn:hover{background:var(--surface3);color:var(--text)}
#zoom-select{
  background:var(--surface3);border:1px solid var(--border2);border-radius:6px;color:var(--text);
  font-family:inherit;font-size:11.5px;padding:5px 6px;outline:none;cursor:pointer;
}

/* ── Minimap ── */
#minimap{
  position:absolute;right:20px;bottom:20px;z-index:5;
  width:220px;height:130px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;overflow:hidden;
}
#minimap-content{position:relative;width:100%;height:100%}
.minimap-node{position:absolute;border-radius:3px;opacity:.85}
#minimap-viewport{position:absolute;border:1.5px solid var(--cyan);background:rgba(var(--cyan-rgb),.1);border-radius:2px;pointer-events:none}
.minimap-expand{
  position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:5px;
  background:var(--surface3);border:none;color:var(--text3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ── Node inspector (phải) — ẩn mặc định, chỉ hiện khi chọn node ── */
#node-inspector{
  width:0;flex-shrink:0;border-left:none;background:var(--surface);
  min-height:0;overflow-y:auto;overflow-x:hidden;padding:0;display:flex;flex-direction:column;gap:16px;
  transition:width .22s cubic-bezier(.4,0,.2,1), padding .22s;
}
#node-inspector.open{width:380px;padding:18px;border-left:1px solid var(--border)}
/* Inspector là flex column + overflow-y:auto → mặc định các con bị co lại (flex-shrink:1)
   khi nội dung dài hơn khung, làm phần điền thông tin của node bị bóp mất.
   Khoá lại để inspector cuộn thay vì nén nội dung. */
#node-inspector > *{flex-shrink:0}
.inspector-header{display:flex;align-items:flex-start;gap:11px}
.inspector-header .node-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.inspector-header .node-icon svg{width:19px;height:19px}
.inspector-header .inspector-title{font-size:15px;font-weight:700;color:var(--text)}
.inspector-header .inspector-desc{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.5}
.inspector-close{
  margin-left:auto;width:24px;height:24px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:none;border:none;
  color:var(--text3);cursor:pointer;
}
.inspector-close:hover{color:var(--text)}
.inspector-close svg{width:14px;height:14px}

.inspector-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2)}
.inspector-row .status-pill{color:var(--green);font-weight:600}

.inspector-section{
  position:relative;isolation:isolate;border-radius:var(--radius-lg);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);box-shadow:none;
}
.inspector-section-header{
  position:relative;z-index:1;display:flex;align-items:center;gap:9px;min-height:40px;
  padding:11px 13px;cursor:pointer;background:var(--surface);opacity:1;visibility:visible;
  font-size:12.5px;font-weight:600;color:var(--text);user-select:none;
}
.inspector-section-header svg.sec-icon{width:15px;height:15px;color:var(--text2);flex-shrink:0}
.inspector-section-header .chev{width:12px;height:12px;color:var(--text3);margin-left:auto;transition:transform .15s;flex-shrink:0}
.inspector-section.collapsed .chev{transform:rotate(-90deg)}
.inspector-section.collapsed .inspector-section-body{display:none}
.inspector-section-body{padding:0 13px 13px;display:flex;flex-direction:column;gap:8px}
.inspector-section-body input, .inspector-section-body select{
  flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-family:inherit;font-size:12px;padding:7px 9px;outline:none;
}
.inspector-section-body input:focus, .inspector-section-body select:focus{border-color:var(--cyan)}
.inspector-inline{display:flex;gap:7px}
.inspector-btn-mini{
  display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border2);
  color:var(--text2);font-size:11.5px;font-weight:500;border-radius:6px;padding:7px 10px;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;
}
.inspector-btn-mini:hover{border-color:var(--cyan);color:var(--text)}
.inspector-btn-mini svg{width:12px;height:12px}
.inspector-btn-mini.wide{flex:1;justify-content:center}

.inspector-delete-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:none;border:1px solid var(--red);color:var(--red);font-weight:600;font-size:12.5px;
  border-radius:9px;padding:10px;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:auto;
}
.inspector-delete-btn:hover{background:rgba(var(--red-rgb),.08)}
.inspector-delete-btn:disabled{opacity:.48;cursor:not-allowed;background:none}
.inspector-delete-btn svg{width:14px;height:14px}
.io-block{border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55}
.io-in{background:rgba(var(--green-rgb),.08);border:1px solid rgba(var(--green-rgb),.25)}
.io-out{background:rgba(var(--cyan-rgb),.08);border:1px solid rgba(var(--cyan-rgb),.25)}
.io-label,.insp-group-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.insp-group-label{color:var(--text3)}
.io-link{color:var(--cyan);cursor:pointer;text-decoration:none}
.io-link:hover{text-decoration:underline}
.io-muted{color:var(--text3)}
.trigger-status{border-radius:9px;padding:10px 12px;background:var(--surface2);font-size:11.5px;line-height:1.5}
.trigger-status button{margin-top:7px}
.trigger-row-badge{
  border-radius:999px;background:var(--surface3);color:var(--text3);
  font-size:9.5px;font-weight:600;padding:3px 7px;margin-left:auto;white-space:nowrap;flex:0 0 auto;
}
.trigger-row-badge.on{background:rgba(var(--green-rgb),.14);color:var(--green)}

.trigger-config-row{
  display:block;border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--surface);overflow:hidden;color:var(--text);
}
.trigger-config-row > summary{
  display:flex!important;align-items:center;gap:9px;box-sizing:border-box;min-height:40px;
  padding:11px 13px;cursor:pointer;list-style:none;background:var(--surface);color:var(--text);
  font-family:inherit;font-size:12.5px;font-weight:600;line-height:1.35;user-select:none;
}
.trigger-config-row > summary::-webkit-details-marker{display:none}
.trigger-config-row-icon{width:15px;height:15px;flex:0 0 15px;color:var(--text2)}
.trigger-config-row-title{
  display:block!important;min-width:0;color:var(--text)!important;opacity:1!important;
  visibility:visible!important;white-space:normal;
}
.trigger-config-chevron{
  width:12px;height:12px;flex:0 0 12px;color:var(--text3);transition:transform .15s;
}
.trigger-config-row:not([open]) .trigger-config-chevron{transform:rotate(-90deg)}
.trigger-config-row-body{padding:0 13px 13px;display:flex;flex-direction:column;gap:8px}
.trigger-config-row-body input,.trigger-config-row-body select{
  flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-family:inherit;font-size:12px;padding:7px 9px;outline:none;
}
.trigger-config-row-body input:focus,.trigger-config-row-body select:focus{border-color:var(--cyan)}
.trigger-config-row > summary .trigger-row-badge{margin-left:auto}

/* ── Main Tab Switcher (Quy trình vs Tác vụ) ── */
.main-tabs {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding: 0 4px;
}
.main-tab-btn {
  background: none;
  border: none;
  color: var(--text2);
  font-family: 'Quicksand', sans-serif;
  font-size: 15px;
  font-weight: 600;
  padding: 8px 16px 14px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.2px;
}
.main-tab-btn svg {
  width: 16px;
  height: 16px;
  transition: transform 0.2s;
}
.main-tab-btn:hover {
  color: var(--text);
}
.main-tab-btn:hover svg {
  transform: translateY(-1px);
}
.main-tab-btn.active {
  color: var(--cyan);
}
.main-tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--cyan);
  border-radius: 3px 3px 0 0;
}
</style>
</head>
<body>

<div id="topbar">
  <span class="logo"><span class="dot"></span>Xanax</span>
  <span class="page-title">Quy trình</span>
</div>

<div id="page-wrap">

  <!-- Main Tabs Switcher -->
  <div class="main-tabs">
    <button class="main-tab-btn active" id="btn-tab-company" onclick="switchMainTab('company')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Quy trình
    </button>
    <button class="main-tab-btn" id="btn-tab-automation" onclick="switchMainTab('automation')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><line x1="9" y1="13" x2="9" y2="14"/><line x1="15" y1="13" x2="15" y2="14"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      Tác vụ tự động
    </button>
  </div>

  <div class="filter-tabs">
    <div class="filter-tabs-list" id="filter-tabs"></div>
    <div class="filter-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Tìm quy trình..." />
    </div>
  </div>

  <div id="grid-wrap">
    <div class="workflow-grid" id="workflow-grid"></div>
  </div>

<script>
// ════════════════════════════════════════
// Bộ icon SVG dùng chung cho UI chrome (khác với ICONS bên dưới — đó là icon
// cho từng loại node trong palette, giữ nguyên hệ thống riêng của nó)
// ════════════════════════════════════════
const UI_ICONS = {
  bolt: '<path d="M13 3L6 14h5l-1 7 7-11h-5l1-7z" fill="currentColor" stroke="none"/>',
  workflow: '<circle cx="5" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"/><path d="M7 6h10"/><path d="M12 8v6"/>',
  scale: '<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-2.5 6a2.5 2.5 0 005 0L5 7z"/><path d="M19 7l-2.5 6a2.5 2.5 0 005 0L19 7z"/>',
  brain: '<path d="M9 4a3 3 0 00-3 3v1a3 3 0 000 6v1a3 3 0 003 3M15 4a3 3 0 013 3v1a3 3 0 010 6v1a3 3 0 01-3 3M9 4v16M15 4v16"/>',
  folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>',
  arrowDown: '<line x1="12" y1="5" x2="12" y2="18"/><path d="M7 13.5L12 18 17 13.5"/>',
};
function icon(name, cls) {
  const inner = UI_ICONS[name] || UI_ICONS.bolt;
  return `<svg class="icon${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${inner}</svg>`;
}

function showToast(message, type = 'info', duration = 3200) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = String(message || '');
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('visible'));
  setTimeout(() => {
    toast.classList.remove('visible');
    setTimeout(() => toast.remove(), 220);
  }, duration);
}

let _confirmResolver = null;
function showConfirm(message, options = {}) {
  if (_confirmResolver) _confirmResolver(false);
  const modal = document.getElementById('confirm-modal');
  if (modal.parentElement !== document.body) document.body.appendChild(modal);
  document.getElementById('confirm-modal-title').textContent = options.title || 'Xác nhận';
  document.getElementById('confirm-modal-desc').textContent = message;
  const action = document.getElementById('confirm-modal-action');
  action.textContent = options.confirmLabel || 'Xác nhận';
  action.classList.toggle('danger', options.danger !== false);
  modal.style.display = 'flex';
  return new Promise(resolve => { _confirmResolver = resolve; });
}

function resolveConfirmModal(result) {
  document.getElementById('confirm-modal').style.display = 'none';
  const resolve = _confirmResolver;
  _confirmResolver = null;
  if (resolve) resolve(Boolean(result));
}

function closeConfirmModal() {
  resolveConfirmModal(false);
}

let _workflowInputResolver = null;
function requestWorkflowInput(isTest) {
  if (_workflowInputResolver) _workflowInputResolver(null);
  document.getElementById('workflow-input-title').textContent =
    isTest ? 'Dữ liệu đầu vào cho lần chạy thử' : 'Yêu cầu đầu vào cho quy trình';
  const input = document.getElementById('workflow-input-value');
  input.value = '';
  document.getElementById('workflow-input-modal').style.display = 'flex';
  setTimeout(() => input.focus(), 0);
  return new Promise(resolve => { _workflowInputResolver = resolve; });
}

function resolveWorkflowInputModal() {
  const value = document.getElementById('workflow-input-value').value;
  document.getElementById('workflow-input-modal').style.display = 'none';
  const resolve = _workflowInputResolver;
  _workflowInputResolver = null;
  if (resolve) resolve(value);
}

function closeWorkflowInputModal() {
  document.getElementById('workflow-input-modal').style.display = 'none';
  const resolve = _workflowInputResolver;
  _workflowInputResolver = null;
  if (resolve) resolve(null);
}

// ── Popup chờ duyệt (node Cổng Duyệt) ─────────────────────────────────────
let _approvalQueue = [];
let _activeApproval = null;

function openApprovalModal(message) {
  _approvalQueue.push(message);
  if (!_activeApproval) _showNextApproval();
}

function _showNextApproval() {
  _activeApproval = _approvalQueue.shift() || null;
  if (!_activeApproval) return;
  const approver = _activeApproval.approver || 'CEO';
  document.getElementById('approval-modal-title').textContent = `Chờ ${approver} duyệt`;
  document.getElementById('approval-modal-title').dataset.approver = approver;
  const noteEl = document.getElementById('approval-modal-note');
  if (_activeApproval.note) { noteEl.textContent = _activeApproval.note; noteEl.style.display = ''; }
  else noteEl.style.display = 'none';
  // Ảnh hiện thật, không hiện link markdown.
  const imgWrap = document.getElementById('approval-modal-images');
  const images = _activeApproval.images || [];
  if (images.length) {
    imgWrap.innerHTML = images.map(url =>
      `<img src="${url}" alt="Ảnh bài đăng" style="max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--border,#334155)">`
    ).join('');
    imgWrap.style.display = '';
  } else {
    imgWrap.innerHTML = '';
    imgWrap.style.display = 'none';
  }
  document.getElementById('approval-modal-content').value = _activeApproval.content || '';
  document.getElementById('approval-modal').style.display = 'flex';
}

async function resolveApprovalModal(approved) {
  if (!_activeApproval) return;
  const outputId = _activeApproval.output_id;
  const editedContent = document.getElementById('approval-modal-content').value;
  document.getElementById('approval-modal').style.display = 'none';
  try {
    await runnerApi('PATCH', `/workflow/outputs/${outputId}`, approved
      ? { review_status: 'approved', edited_content: editedContent }
      : { review_status: 'rejected' });
  } catch (error) {
    showToast(`Không thể gửi quyết định duyệt: ${error.message}`, 'error');
  }
  _showNextApproval();
}

let REAL_TASKS = [];

const STATUS_LABEL = { active: 'Đang bật', paused: 'Tạm dừng', draft: 'Nháp', failed: 'Thất bại' };

const FILTERS = [
  { key: 'all',    label: 'Tất cả',    icon: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>' },
  { key: 'active', label: 'Đang bật',  icon: '<polygon points="6 3 20 12 6 21 6 3"/>' },
  { key: 'paused', label: 'Tạm dừng',  icon: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' },
  { key: 'draft',  label: 'Nháp',      icon: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>' },
  { key: 'failed', label: 'Thất bại',  icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
];

const urlParams = new URLSearchParams(location.search);
let currentMainTab = urlParams.get('tab') || 'company';
let currentStatus = 'all';
let searchQuery = '';

function wfNoun(cap) {
  const isAutomation = currentMainTab === 'automation';
  if (cap) return isAutomation ? 'Tác vụ' : 'Quy trình';
  return isAutomation ? 'tác vụ' : 'quy trình';
}

function updateMainTabLabels() {
  document.getElementById('search-input').placeholder = `Tìm ${wfNoun()}...`;
  document.getElementById('add-workflow-btn').lastChild.textContent = ` ${wfNoun(true)} Mới`;
}

function rateClass(v) {
  if (v >= 80) return 'good';
  if (v >= 50) return 'warn';
  return 'bad';
}

async function switchMainTab(tabKey) {
  currentMainTab = tabKey;
  document.querySelectorAll('.main-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.id === `btn-tab-${tabKey}`);
  });
  currentStatus = 'all';
  updateMainTabLabels();
  await loadWorkflowList();
}

function renderFilterTabs() {
  const wrap = document.getElementById('filter-tabs');
  const activeList = REAL_TASKS;
  wrap.innerHTML = FILTERS.map(f => {
    const count = f.key === 'all' ? activeList.length : activeList.filter(w => w.status === f.key).length;
    return `<button class="filter-tab ${f.key === currentStatus ? 'active' : ''}" data-key="${f.key}" onclick="setStatusFilter('${f.key}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${f.icon}</svg>
      ${f.label} <span class="count">${count}</span>
    </button>`;
  }).join('');
}

function setStatusFilter(key) {
  currentStatus = key;
  renderFilterTabs();
  renderGrid();
}

function renderFlow(flow) {
  return `<div class="wf-flow">` + flow.map((s, i) => {
    const color = s.color || 'var(--text3)';
    const node = `<div class="wf-flow-node" title="${s.title || ''}" style="background:${color}"></div>`;
    const line = i < flow.length - 1 ? `<div class="wf-flow-line" style="background:${color}"></div>` : '';
    return node + line;
  }).join('') + `</div>`;
}

function renderGrid() {
  const activeList = REAL_TASKS;
  let items = currentStatus === 'all' ? activeList : activeList.filter(w => w.status === currentStatus);
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    items = items.filter(w => w.name.toLowerCase().includes(q));
  }
  const grid = document.getElementById('workflow-grid');

  if (!items.length) {
    const trulyEmpty = !REAL_TASKS.length && currentStatus === 'all' && !searchQuery.trim();
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">${icon('folder')}</div>
      <div class="empty-state-text">${trulyEmpty ? `Chưa có ${wfNoun()} nào — tạo cái đầu tiên của bạn` : `Không tìm thấy ${wfNoun()} phù hợp`}</div>
      ${trulyEmpty ? `<button class="wf-btn primary" style="margin-top:12px" onclick="openCreateWorkflowModal()">+ Tạo ${wfNoun()}</button>` : ''}
    </div>`;
    return;
  }

  grid.innerHTML = items.map(w => `
    <div class="workflow-card" onclick="openEditor(${w.id})">
      <div class="wf-card-top">
        <div class="wf-name">${w.name}</div>
        <div class="wf-status ${w.status}"><span class="dot"></span>${STATUS_LABEL[w.status]}</div>
      </div>
      <div class="wf-desc">${w.desc}</div>
      ${renderFlow(w.flow)}
      <div class="wf-stats">
        <div class="wf-stat">
          <span class="wf-stat-label">Tỷ lệ thành công</span>
          <span class="wf-stat-value ${w.totalRuns ? rateClass(w.successRate) : 'muted'}">${w.totalRuns ? w.successRate + '%' : '—'}</span>
        </div>
        <div class="wf-stat">
          <span class="wf-stat-label">Tổng lần chạy</span>
          <span class="wf-stat-value neutral">${w.totalRuns}</span>
        </div>
        <div class="wf-stat">
          <span class="wf-stat-label">Lần chạy cuối</span>
          <span class="wf-stat-value muted">${w.lastRun}</span>
        </div>
      </div>
      ${w.schedule ? `<div class="wf-schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>${w.schedule}</div>` : ''}

}

function inferNodeType(node) {
  if (node.type) return node.type;
  if (node.kind === 'start') return 'trigger';
  if (node.kind === 'end') return 'end';
  if (node.kind === 'branch') return 'condition';
  return 'agent';
}

function graphNodeToEditor(node, index = 0) {
  const type = inferNodeType(node);
  const data = node.data && typeof node.data === 'object' ? {...node.data} : {};
  const meta = NODE_META[type] || NODE_META.noop;
  return {
    ...node,
    type,
    data,
    x: Number.isFinite(Number(node.x)) ? Number(node.x) : 60 + index * 230,
    y: Number.isFinite(Number(node.y)) ? Number(node.y) : 80,
    title: node.title || data.label || data.agent_name || meta.title,
    sub: node.sub || data.instructions || data.tool_name || '',
    color: node.color || meta.color,
    icon: node.icon || meta.icon,
    kind: node.kind || meta.kind,
  };
}

function refreshNodePresentation(node) {
  const type = inferNodeType(node), data = node.data || {};
  const meta = NODE_META[type] || NODE_META.noop;
  node.type = type; node.kind = meta.kind || type; node.icon = node.icon || meta.icon; node.color = node.color || meta.color;
  node.title = data.label || meta.title;
  if (type === 'agent') {
    const agent = builderAgents.find(a => String(a.id) === String(data.agent_id));
    const effectiveIds = data.skill_ids?.length ? data.skill_ids : (agent?.skills || []);
    const skills = effectiveIds.map(id => builderSkills.find(s => String(s.id) === String(id))?.name).filter(Boolean);
    node.sub = `${agent?.name || 'Chưa chọn nhân viên AI'}${skills.length ? ` · ${skills.join(', ')}` : ' · Không có kỹ năng'}`;
  } else if (type === 'tool_call') node.sub = data.tool_name || 'Chưa chọn công cụ';
  else if (type === 'workflow_call') {
    const target = builderWorkflows.find(w => String(w.id) === String(data.target_task_id));
    node.sub = target ? target.name : 'Chưa chọn tác vụ';
  }
  else if (type === 'delay') node.sub = `${Number(data.seconds || 0)} giây`;
  else if (type === 'approval_gate') node.sub = `Chờ ${data.approver || 'CEO'} duyệt`;
  else if (type === 'condition') node.sub = `${data.field || 'last_output'} ${data.mode || 'contains'} ${data.value || ''}`;
  else node.sub = data.instructions || data.message || '';
}

function graphEdgeToEditor(edge) {
  if (Array.isArray(edge)) return edge;
  const label = edge.branch === 'true' ? 'Đúng' : edge.branch === 'false' ? 'Sai' : (edge.label || '');
  return [edge.from, edge.to, label, edge.color || ''];
}

function editorNodeToGraph(node) {
  const type = inferNodeType(node);
  const data = {...(node.data || {})};
  if (!data.label && node.title && node.title !== NODE_META[type]?.title) data.label = node.title;
  if (type === 'agent' && node.sub && !data.instructions) data.instructions = node.sub;
  return {id: node.id, type, x: Math.round(node.x || 0), y: Math.round(node.y || 0), data};
}

function editorEdgeToGraph(edge) {
  if (!Array.isArray(edge)) return edge;
  const [from, to, label, color] = edge;
  const branch = label === 'Đúng' ? 'true' : label === 'Sai' ? 'false' : null;
  return {from, to, branch, ...(color ? {color} : {})};
}

function slugify(str) {
  return String(str).toLowerCase()
    .normalize('NFD').replace(/\p{Mn}/gu, '')
    .replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function findWorkflow(idOrSlug) {
  return REAL_TASKS.find(w => String(w.id) === String(idOrSlug))
      || REAL_TASKS.find(w => slugify(w.name) === String(idOrSlug));
}

async function runnerApi(method, path, body) {
  const response = await fetch('/api' + path, {
    method,
    credentials: 'same-origin',
    headers: body === undefined ? {} : {'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!response.ok) {
    let detail = `${response.status} ${response.statusText}`;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  if (response.status === 204) return null;
  return response.json();
}

async function loadWorkflowSettings(id) {
  currentWorkflowId = Number(id) || null;
  currentWorkflowRecord = null;
  if (!currentWorkflowId) return;
  try {
    const [task, projectsData, agentsData, skillsData, toolsData, workflowsData] = await Promise.all([
      runnerApi('GET', `/workflow/tasks/${currentWorkflowId}`),
      runnerApi('GET', '/projects/'),
      runnerApi('GET', '/agent-configs/'),
      runnerApi('GET', '/skills/'),
      runnerApi('GET', '/tools/'),
      runnerApi('GET', '/workflow/tasks'),
    ]);
    currentWorkflowRecord = task;
    workflowProjects = projectsData.projects || [];
    builderAgents = agentsData.agents || [];
    builderSkills = skillsData.skills || [];
    builderTools = toolsData.tools || [];
    builderWorkflows = workflowsData.tasks || [];
  } catch {
    // Một số card hiện vẫn là dữ liệu demo và chưa có workflow_tasks tương ứng.
    currentWorkflowRecord = null;
    workflowProjects = [];
    builderAgents = [];
    builderSkills = [];
    builderTools = [];
    builderWorkflows = [];
  }
}

function normalizeTriggers(record) {
  let cfg = {};
  try { cfg = JSON.parse(record?.trigger_config_json || '{}'); } catch {}
  if (cfg.triggers && typeof cfg.triggers === 'object') {
    return {
      manual:{enabled:false,...cfg.triggers.manual},
      schedule:{enabled:false,cron:record?.schedule_cron || '',...cfg.triggers.schedule},
      webhook:{enabled:false,webhook_token:cfg.webhook_token || '',...cfg.triggers.webhook},
      workflow_complete:{enabled:false,source_task_id:cfg.source_task_id ?? '',...cfg.triggers.workflow_complete},
      meeting_decision:{enabled:false,project_id:cfg.project_id ?? '',...cfg.triggers.meeting_decision},
    };
  }
  const type = record?.trigger_type || (record?.schedule_enabled ? 'schedule' : 'manual');
  return {
    manual:{enabled:type === 'manual'},
    schedule:{enabled:!!record?.schedule_enabled || type === 'schedule',cron:record?.schedule_cron || ''},
    webhook:{enabled:type === 'webhook',webhook_token:cfg.webhook_token || ''},
    workflow_complete:{enabled:type === 'workflow_complete',source_task_id:cfg.source_task_id ?? ''},
    meeting_decision:{enabled:type === 'meeting_decision',project_id:cfg.project_id ?? ''},
  };
}

// Node bắt đầu nhận mọi hình thức kích hoạt cùng lúc — không bật/tắt thủ công.
// Hình thức nào được điền cấu hình thì tự bật; chạy tay và webhook luôn sẵn sàng.
function deriveTriggerEnabled(triggers) {
  const t = {...triggers};
  t.manual = {...(t.manual || {}), enabled: true};
  t.webhook = {...(t.webhook || {}), enabled: true};
  t.schedule = {...(t.schedule || {}), enabled: !!String(t.schedule?.cron || '').trim()};
  t.workflow_complete = {...(t.workflow_complete || {}), enabled: !!t.workflow_complete?.source_task_id};
  t.meeting_decision = {...(t.meeting_decision || {}), enabled: !!t.meeting_decision?.project_id};
  return t;
}

// Cột trigger_type chỉ là "hình thức chính" để tương thích ngược; việc điều phối
// thật sự dựa trên cờ enabled trong trigger_config_json nên mọi hình thức vẫn chạy.
function primaryTriggerType(triggers) {
  const t = deriveTriggerEnabled(triggers);
  return ['meeting_decision','workflow_complete','schedule'].find(key => t[key]?.enabled) || 'manual';
}

function activeTriggerLabels(triggers) {
  const t = deriveTriggerEnabled(triggers);
  return SIMPLE_TRIGGER_KEYS.filter(key => t[key]?.enabled).map(key => SIMPLE_TRIGGER_LABEL[key]);
}

function buildTriggerConfig(triggers) {
  const clean = {
    manual:{enabled:!!triggers.manual?.enabled},
    schedule:{enabled:!!triggers.schedule?.enabled,cron:triggers.schedule?.cron || ''},
    webhook:{enabled:!!triggers.webhook?.enabled,webhook_token:triggers.webhook?.webhook_token || ''},
    workflow_complete:{enabled:!!triggers.workflow_complete?.enabled,source_task_id:triggers.workflow_complete?.source_task_id || null},
    meeting_decision:{enabled:!!triggers.meeting_decision?.enabled,project_id:triggers.meeting_decision?.project_id || null},
  };
  return {
    triggers:clean,
    webhook_token:clean.webhook.webhook_token || '',
    project_id:clean.meeting_decision.project_id,
    source_task_id:clean.workflow_complete.source_task_id,
  };
}
