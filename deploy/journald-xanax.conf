# Giới hạn dung lượng journald. Cài thành:
#   /etc/systemd/journald.conf.d/99-xanax.conf
#
# Mặc định journald được phép ăn tới 10% filesystem — trên ổ 60 GB là ~6 GB, và
# nó lớn dần một cách âm thầm. Xanax ghi toàn bộ stdout/stderr vào journal, kể cả
# output dài của claude/codex CLI, nên mức tăng không hề nhỏ.
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
# Giữ tối đa 30 ngày; cũ hơn thế thì đọc log không còn giúp chẩn đoán gì.
MaxRetentionSec=30day
