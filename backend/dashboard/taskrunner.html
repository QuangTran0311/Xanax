<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quy trình — Xanax</title>
<link rel="icon" href="/static/images/xanax.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/taskrunner.css">
</head>
<body>

<div id="topbar">
  <span class="logo"><span class="dot"></span>Xanax</span>
  <span class="page-title">Quy trình</span>
</div>

<div id="page-wrap">

  <!-- Main Tabs Switcher -->
  <div class="main-tabs">
    <button class="main-tab-btn active" id="btn-tab-company" onclick="switchMainTab('company')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Quy trình
    </button>
    <button class="main-tab-btn" id="btn-tab-automation" onclick="switchMainTab('automation')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><line x1="9" y1="13" x2="9" y2="14"/><line x1="15" y1="13" x2="15" y2="14"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      Tác vụ tự động
    </button>
  </div>

  <div class="filter-tabs">
    <div class="filter-tabs-list" id="filter-tabs"></div>
    <div class="filter-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Tìm quy trình..." />
    </div>
  </div>

  <div id="grid-wrap">
    <div class="workflow-grid" id="workflow-grid"></div>
  </div>

  <button id="add-workflow-btn" onclick="openCreateWorkflowModal()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Quy Trình Mới
  </button>

</div>

<!-- ═══════════ EDITOR VIEW (route con /taskrunner/<id>) ═══════════ -->
<div id="view-editor" style="display:none">

  <div id="editor-topbar">
    <button class="editor-icon-btn" id="editor-back-btn" onclick="closeEditor()" title="Quay lại danh sách quy trình">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="editor-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="7" r="2.4"/><circle cx="5" cy="17" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M7 7h4a3 3 0 0 1 3 3v0"/><path d="M7 17h4a3 3 0 0 0 3-3v0"/></svg>
    </div>
    <div class="editor-title-wrap">
      <span id="editor-title" class="editor-title"></span>
      <button class="editor-icon-btn small" onclick="renameWorkflow()" title="Đổi tên quy trình">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <button class="editor-btn" id="editor-mode-btn" onclick="toggleEditorMode()" style="margin-left:14px;background:rgba(var(--cyan-rgb),0.1);color:var(--cyan);border-color:rgba(var(--cyan-rgb),0.35);font-weight:600;">
      Chế độ: Đơn giản
    </button>
    <div class="editor-topbar-spacer"></div>
    <button class="editor-btn" onclick="openTriggerInspector()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Kích Hoạt &amp; Lịch
    </button>
    <button class="editor-btn" onclick="saveGraph()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Lưu
    </button>
    <button class="editor-btn" onclick="runWorkflow(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      Chạy Thử
    </button>
    <button class="editor-btn primary" id="run-workflow-btn" onclick="runWorkflow(false)">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      Chạy
    </button>
    <button class="editor-btn" id="cancel-workflow-btn" onclick="cancelWorkflowRun()" style="display:none;color:var(--red);">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Huỷ
    </button>
  </div>

  <div id="editor-body">

    <!-- ── Node palette (trái) ── -->
    <aside id="node-palette">
      <div class="palette-header">ADD NODE — kéo thả vào sơ đồ</div>
      <div class="palette-search">
        <input type="text" id="node-search-input" placeholder="Tìm node..." />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div id="palette-categories"></div>
    </aside>

    <!-- ── Canvas (giữa) ── -->
    <div id="canvas-wrap">
      <button class="architect-btn" onclick="showToast('Kiến trúc sư quy trình AI đang được phát triển.','info')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        Kiến Trúc Sư Quy Trình
      </button>

      <div id="editor-canvas">
        <div id="canvas-viewport">
          <svg id="canvas-lines"></svg>
          <div id="canvas-nodes"></div>
        </div>
      </div>

      <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomBy(10)" title="Phóng to">+</button>
        <button class="zoom-btn" onclick="zoomBy(-10)" title="Thu nhỏ">−</button>
        <button class="zoom-btn" onclick="fitView()" title="Vừa khung hình">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="zoom-btn" onclick="toggleLockCanvas()" title="Khoá canvas" id="lock-canvas-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <select id="zoom-select" onchange="setZoom(this.value)">
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100" selected>100%</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
        </select>
        <button class="zoom-btn" onclick="showToast('Tính năng hoàn tác đang được phát triển.','info')" title="Hoàn tác">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="zoom-btn" onclick="showToast('Tính năng làm lại đang được phát triển.','info')" title="Làm lại">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
      </div>

      <div id="minimap">
        <div id="minimap-content"></div>
        <button class="minimap-expand" title="Phóng to minimap">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Simple Editor (giữa) ── -->
    <div id="simple-editor-container" style="display:none;flex:1;overflow-y:auto;padding:24px;background:var(--bg);flex-direction:column;align-items:center;gap:16px;min-height:0;">
    </div>

    <!-- ── Node inspector (phải) ── -->
    <aside id="node-inspector"></aside>

  </div>

  <!-- ── Popup xác nhận dùng chung ── -->
  <div id="confirm-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeConfirmModal()">
    <div class="modal-box">
      <div class="modal-title" id="confirm-modal-title">Xác nhận</div>
      <div class="modal-desc" id="confirm-modal-desc"></div>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeConfirmModal()">Huỷ</button>
        <button class="modal-btn danger" id="confirm-modal-action" onclick="resolveConfirmModal(true)">Xác nhận</button>
      </div>
    </div>
  </div>

  <div id="workflow-input-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeWorkflowInputModal()">
    <div class="modal-box" style="width:min(500px,calc(100vw - 40px))">
      <div class="modal-title" id="workflow-input-title">Dữ liệu đầu vào</div>
      <div class="modal-desc">Nhập nội dung được chuyển vào node bắt đầu của quy trình.</div>
      <textarea id="workflow-input-value" class="modal-input" rows="5"></textarea>
      <div class="modal-actions" style="margin-top:16px">
        <button class="modal-btn" onclick="closeWorkflowInputModal()">Huỷ</button>
        <button class="modal-btn primary" onclick="resolveWorkflowInputModal()">Chạy</button>
      </div>
    </div>
  </div>

  <!-- ── Popup chờ duyệt (node Cổng Duyệt) — hiện nội dung bước trước, cho sửa,
       Duyệt để đi tiếp hoặc Không duyệt để chạy lại bước trước ── -->
  <div id="approval-modal" class="modal-overlay" style="display:none;z-index:1200">
    <div class="modal-box" style="width:min(560px,calc(100vw - 40px))">
      <div class="modal-title" id="approval-modal-title">Chờ CEO duyệt</div>
      <div class="modal-desc" id="approval-modal-note" style="display:none"></div>
      <div id="approval-modal-images" style="display:none;margin-bottom:12px;text-align:center"></div>
      <label class="se-field-label">Nội dung bài đăng — có thể sửa trước khi duyệt</label>
      <textarea id="approval-modal-content" class="modal-input" rows="8"></textarea>
      <div class="modal-actions" style="margin-top:16px">
        <button class="modal-btn danger" onclick="resolveApprovalModal(false)">Không duyệt — chạy lại bước trước</button>
        <button class="modal-btn primary" onclick="resolveApprovalModal(true)">Duyệt & Tiếp tục</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<div id="pick-node-modal" style="display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this) closePickNodeModal()">
  <div class="modal-box" style="width:min(620px,100%);max-height:82vh;display:flex;flex-direction:column">
    <div class="modal-title">Chọn loại bước muốn chèn</div>
    <div class="modal-desc" id="pick-node-desc">Bước mới sẽ được chèn ngay sau bước đang chọn.</div>
    <div id="pick-node-list" style="overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="modal-btn" onclick="closePickNodeModal()">Huỷ</button>
    </div>
  </div>
</div>

<div id="create-workflow-modal" style="display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this) closeCreateWorkflowModal()">
  <div class="modal-box" style="width:min(520px,100%)">
    <div class="modal-title" id="create-workflow-title">Tạo quy trình mới</div>
    <div class="modal-desc" id="create-workflow-kind-label"></div>
    <label class="se-field-label" id="create-workflow-name-label">Tên quy trình *</label>
    <input id="create-workflow-name" class="se-input" style="width:100%;margin-bottom:12px" maxlength="120">
    <label class="se-field-label">Mô tả</label>
    <textarea id="create-workflow-description" class="se-input" rows="3" style="width:100%;margin-bottom:12px"></textarea>
    <label class="se-field-label">Dự án (tuỳ chọn)</label>
    <select id="create-workflow-project" class="se-input" style="width:100%"><option value="">— Không gắn dự án —</option></select>
    <div class="modal-actions" style="margin-top:16px">
      <button class="modal-btn" onclick="closeCreateWorkflowModal()">Huỷ</button>
      <button class="modal-btn primary" id="create-workflow-submit" onclick="createWorkflowTask()">Tạo và mở trình sửa</button>
    </div>
  </div>
</div>

<div id="run-history-modal" style="display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this) closeRunHistory()">
  <div class="modal-box" style="width:min(680px,100%);max-height:80vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="modal-title" id="run-history-title">Lịch sử chạy</div>
      <button class="editor-icon-btn" onclick="closeRunHistory()">×</button>
    </div>
    <div id="run-history-content"></div>
  </div>
</div>

<script src="/static/taskrunner.js" defer></script>
</body>
</html>
