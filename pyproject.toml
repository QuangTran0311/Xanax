[project]
name = "hermes-hub"
version = "1.0.0"
description = "Hermes Agent Hub — AI Orchestration Server"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",

    # Config & validation
    "pydantic-settings>=2.7.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # AI
    "anthropic>=0.40.0",
    "mcp>=1.6.0",

    # Logging
    "loguru>=0.7.3",

    # Misc
    "python-multipart>=0.0.20",
]

[project.scripts]
hermes     = "app.main:run"
hermes-mcp = "mcp_server.server:run"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
